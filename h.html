<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        /* Your CSS styles here */
        body{
  margin:0;
  background:#0f172a;
  color:white;
  font-family:system-ui, sans-serif;
}

.wrap{
  min-height:200vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10vw;
}

/* container */
.reveal-text{
  font-size:clamp(2rem,6vw,5rem);
  line-height:1.15;
  display:flex;
  flex-direction:column;
  gap:0.5em;
}

/* hide lines initially */
.reveal-text span{
  display:block;
  overflow:hidden;
}

/* animated inner text */
.reveal-text span::before{
  content:attr(data-text);
}

.reveal-text span{
  opacity:0;
  transform:translateY(100%);
  animation: textReveal linear forwards;
  animation-timeline:view();
  animation-range: entry 20% cover 40%;
}

/* stagger using nth-child */
.reveal-text span:nth-child(1){ animation-delay:0.1s; }
.reveal-text span:nth-child(2){ animation-delay:0.25s; }
.reveal-text span:nth-child(3){ animation-delay:0.4s; }
.reveal-text span:nth-child(4){ animation-delay:0.55s; }

@keyframes textReveal{
  to{
    opacity:1;
    transform:translateY(0);
  }
}
    </style>
<section class="wrap">
    <h1 class="reveal-text">
        <span>Design is not decoration.</span>
        <span>It is communication.</span>
        <span>It is emotion.</span>
        <span>It is experience.</span>
    </h1>
</section>
</body>
</html>
