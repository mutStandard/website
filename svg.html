<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG</title>
</head>
<body>
    <style>
        :root{
            --dark-color: #1C2CDA;
            --light-color: #27A5C8;
        }

        svg{
            cursor: pointer;
        }

        .section_center {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #lightG{
            fill:var(--light-color)
        }

        #darkG{
            fill:var(--dark-color)
        }

        #light2,
        #dark1,
        #dark2{
            transition: all 1s ease;
        }

        #dark2{
            transform: translateX(-100%);
        }

        svg:hover #light2{
            transform: translateX(20%);
        }

        svg:hover #dark1{
            transform: translateX(40%);
            opacity: 0;
        }

        svg:hover #dark2{
            transform: translateX(0%);
        }

    </style>
    <section>
        <div class="section_center">
            <svg width="548" height="350" viewBox="0 0 548 400" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g id="triangle">
                    <g id="lightG">
                        <g id="light">
                            <path id="light2" opacity="0.5"
                                d="M289.066 175.395C307.166 187.238 307.166 213.762 289.066 225.604L213.034 275.348C193.081 288.402 166.609 274.087 166.609 250.244L166.609 150.756C166.609 126.912 193.081 112.597 213.034 125.651L289.066 175.395Z"/>
                        </g>
                    </g>
                    <g id="darkG">
                        <path id="dark1" opacity="0.8"
                            d="M289.066 175.395C307.166 187.238 307.166 213.762 289.066 225.604L213.034 275.348C193.081 288.402 166.609 274.087 166.609 250.244L166.609 150.756C166.609 126.912 193.081 112.597 213.034 125.651L289.066 175.395Z" />
                        <path id="dark2" opacity="0.6"
                            d="M380.066 175.395C398.166 187.238 398.166 213.762 380.066 225.604L304.034 275.348C284.081 288.402 257.609 274.087 257.609 250.244L257.609 150.756C257.609 126.912 284.081 112.597 304.034 125.651L380.066 175.395Z" />    
                    </g>
                    
                </g>
            </svg>
        
        </div>
    </section>

    <script>
        
        const svg = document.getElementById('triangle');

        svg.onclick = (e) => {
            const colors = ["red", "blue", "green", "yellow", "orange", "purple","pink", "cyan", "magenta", "lime", "teal", "indigo", "violet"];
            const rando = colors[Math.floor(Math.random() * colors.length)];
            document.documentElement.style.cssText = `
            --dark-color: ${rando}; 
            --light-color: ${rando};
            `
        }
    </script>
</body>
</html>
