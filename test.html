<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
 
  font-family: Arial, sans-serif;
  color: white;
}

.grid-section {
  display: grid;
 /* grid-template-columns: 1.2fr 1fr 1fr;
  grid-template-rows: 350px 350px; */
  grid-template-columns: repeat(2, 1fr);
  min-height: 100vh; 
  background: #19191a;
  gap: .2em;
}

/* LEFT FEATURE */
.feature {
  grid-row: span 2;
  background: #1f79ffee;
  padding: 60px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.feature .tag {
  font-size: 14px;
  margin-bottom: 20px;
  opacity: 0.9;
}

.feature h1 {
  font-size: clamp(2rem, 4vw, 3.5rem);
  line-height: 1.1;
  font-weight: 500;
}

/* CARDS */
.card {
  background: #15151a;
  padding: 40px;
  display: flex;
  align-items: flex-end;
  transition: 0.4s ease;
  border: 1px solid rgba(255,255,255,0.05);
}

.card:hover {
  background: #1d1d23;
}

.card p {
  font-size: 1.2rem;
  max-width: 250px;
}


/* RESPONSIVE */
@media (max-width: 900px) {
  .grid-section {
    grid-template-columns: 1fr;
    grid-template-rows: auto;
  }

  .feature {
    grid-row: auto;
    grid-column: span 2;
  }

  .card-large {
    grid-column: auto;
  }

  .card {
    min-height: 250px;
  }
  .contrainer{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    
  }
}

.add-0 {
  margin-left: 1%;
  margin-right: 1%;
}


 .contrainer{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    /* grid-template-rows: repeat(1, 2fr); */
    grid-row: span 2;

  }

</body>
</html>
